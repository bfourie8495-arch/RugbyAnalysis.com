name: Daily data refresh

on:
  schedule:
       - cron: "17 5 * * *"    # 05:17 UTC every day
       - cron: "47 21 * * *"   # 21:47 UTC every day (catches evening results)
  workflow_dispatch:         # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Probe sources (temporary)
        run: cd pipeline && python probe.py
      - name: Save probe output (temporary)
        run: |
          git config user.name  "rugbyanalysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/_probe && git commit -m "Probe output" && git push
