name: Daily data refresh

on:
  schedule:
       - cron: "17 5 * * *"    # 05:17 UTC every day
       - cron: "47 21 * * *"   # 21:47 UTC every day (catches evening results)
  workflow_dispatch:         # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Pull new results, fixtures, stats, line-ups and rankings
        run: python pipeline/update.py

      - name: Rebuild the site
        run: python pipeline/build_all.py

      - name: Save changes (Cloudflare redeploys automatically)
        run: |
          git config user.name  "rugbyanalysis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data today."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
