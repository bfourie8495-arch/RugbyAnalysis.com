name: Probe sources (temporary)
on:
  push:
    branches: [claude/auto-update-all-competitions-f92x88]
    paths: [pipeline/*.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Full refresh (not saved)
        run: python pipeline/update.py
      - name: Rebuild
        run: python pipeline/build_all.py
      - run: git status --short | head -40; git diff --stat | tail -30
