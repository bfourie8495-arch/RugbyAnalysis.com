name: App APK

# Builds the Android app and publishes it as the "app-latest" release, so a phone can
# install it straight from:
#   https://github.com/bfourie8495-arch/RugbyAnalysis.com/releases/download/app-latest/RugbyAnalysis.apk
# It's signed with a throwaway debug key: fine for trying the app, not for Google Play.
on:
  push:
    branches: [main, claude/flutter-app]
    paths: ["app/**", ".github/workflows/app-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk RugbyAnalysis.apk
      - name: Publish as the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest RugbyAnalysis.apk --prerelease --target "$GITHUB_SHA" \
            --title "RugbyAnalysis app (latest test build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open this page on your Android phone, tap RugbyAnalysis.apk and allow installs from your browser when asked."
