name: App APK

# Builds the Android app:
#  - RugbyAnalysis.apk, published as the "app-latest" release, so a phone can install it from
#    https://github.com/bfourie8495-arch/RugbyAnalysis.com/releases/download/app-latest/RugbyAnalysis.apk
#  - RugbyAnalysis.aab, the bundle for Google Play, kept as a (private) download on the run's page,
#    and on the draft release "play-bundle" (drafts are visible only to the repo's owners), named
#    RugbyAnalysis-<build>.aab, so it can be fetched with the REST API for uploading to Play Console.
# Both are signed with the upload key from the repo's secrets (made by app/make-upload-key.ps1),
# so each new APK installs over the last. Until those secrets exist, a throwaway key is used.
# The build number goes up by one each run, as Google Play requires.
on:
  push:
    branches: [main, claude/flutter-app]
    paths: ["app/**", ".github/workflows/app-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No upload key in the repo's secrets yet, so this build uses a throwaway key (run app/make-upload-key.ps1)."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Build
        run: |
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number=$BUILD
          flutter build appbundle --release --build-number=$BUILD
          cp build/app/outputs/flutter-apk/app-release.apk RugbyAnalysis.apk
          cp build/app/outputs/bundle/release/app-release.aab RugbyAnalysis.aab
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
      - name: Keep the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: RugbyAnalysis-aab-${{ env.BUILD }}
          path: app/RugbyAnalysis.aab
          retention-days: 30
      - name: Publish the APK as the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest RugbyAnalysis.apk --prerelease --target "$GITHUB_SHA" \
            --title "RugbyAnalysis app (latest test build)" \
            --notes "Build ${BUILD}, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open this page on your Android phone, tap RugbyAnalysis.apk and allow installs from your browser when asked."
      - name: Keep the Play bundle on a draft release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp RugbyAnalysis.aab "RugbyAnalysis-${BUILD}.aab"
          gh release delete play-bundle --yes || true
          gh release create play-bundle "RugbyAnalysis-${BUILD}.aab" --draft --target "$GITHUB_SHA" \
            --title "Play bundle (build ${BUILD})" --notes "For uploading to Play Console. Draft: not public."
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
