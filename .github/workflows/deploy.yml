name: Deploy site to Cloudflare

# Publishes site/ straight from GitHub, so the site no longer depends on
# Cloudflare's own build machines (Workers Builds) starting up.
on:
  push:
    branches: [main]
  workflow_run:
    # data-refresh commits are pushed with the built-in token, which does not
    # trigger "push" workflows, so deploy when the refresh job finishes instead
    workflows: ["Daily data refresh"]
    types: [completed]
  workflow_dispatch:         # adds a "Run workflow" button for a manual deploy

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish site/ to rugbyanalysis.com
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # static-assets-only Workers (no "main" script) need Wrangler 4; the action defaults to 3
          wranglerVersion: "4"
