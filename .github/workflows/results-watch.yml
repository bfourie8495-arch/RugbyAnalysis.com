name: Results watch

# Every quarter of an hour: if a Test kicked off 100+ minutes ago and its result isn't in yet, start the
# data refresh (which pulls the result, rebuilds the site and the app's feeds, and Cloudflare redeploys).
# The check itself takes seconds; the refresh runs at most every 25 minutes while a result is awaited,
# for up to 8 hours after kick-off. GitHub may start scheduled runs a little late at busy times.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: results-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline
      - id: due
        run: python pipeline/results_due.py >> "$GITHUB_OUTPUT"
      - name: Start the data refresh
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not if one started in the last 25 minutes (it may already have the result, or ESPN isn't final yet).
          last=$(gh run list --workflow update.yml --limit 1 --json createdAt -q '.[0].createdAt')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 1500 ]; then
            echo "A refresh started at $last; waiting for the next check."
          else
            gh workflow run update.yml --ref main
            echo "Data refresh started."
          fi
