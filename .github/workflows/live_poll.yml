name: Live score freshness poll
on: workflow_dispatch
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python pipeline/live_poll.py
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          HOME_TEAM: Clermont
          AWAY_TEAM: Leinster
          START_UTC: "14:10"
          MINUTES: "45"
